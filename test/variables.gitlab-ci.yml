stages:
  - mssql_build
  - mssql_runscript

variables:

image: busybox

build_mssql:
  stage: mssql_build
  image: mcr.microsoft.com/mssql/server:2019-latest
  script:
    - sleep 5m
    - echo "Done"

run_script:
  stage: mssql_runscript
  script:
    - echo "Running scripts..."
    - sleep 2m
    - exit 13
